name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android (unit tests + debug build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # debug.keystore is gitignored (app/build.gradle.kts' debugConfig expects it at repo root)
      # - this is Android's standard debug keystore with fixed, non-secret credentials
      # (androiddebugkey/android), the same one Android Studio auto-generates locally when missing.
      - name: Generate debug keystore
        run: |
          keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey \
            -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      # --continue: a handful of known, pre-existing test failures (see docs/CORRECTIONS_LOG.md /
      # this session's CI investigation) currently make testDebugUnitTest fail on every run: Gradle
      # would otherwise abort before assembleDebug ever runs, so the APK - which builds cleanly on
      # its own - never gets produced or uploaded. --continue runs both requested tasks regardless,
      # so a debug APK is always available from this job even while those failures are open; the job
      # still reports red overall (this doesn't hide the failing tests).
      - name: Unit tests + assembleDebug
        run: ./gradlew testDebugUnitTest assembleDebug --console=plain --continue

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: app/build/reports/tests/testDebugUnitTest
          retention-days: 14

      - name: Upload debug APK
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  server:
    name: Server (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            server/requirements/base.txt
            server/requirements/dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements/base.txt -r requirements/dev.txt

      - name: Run migrations against a fresh SQLite DB
        run: python -m alembic upgrade head

      - name: Run tests
        run: python -m pytest -q
